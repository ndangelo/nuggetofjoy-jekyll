title: "Nugget of Joy"
description: "Design, creativity, and user experience"
url: "https://ndangelo.github.io"
baseurl: "/nuggetofjoy-jekyll"

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/

collections:
  content_pages:
    path: _pages
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: content_pages
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - migration-input
