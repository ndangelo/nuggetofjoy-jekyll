name: Validate CMS prototype

on:
  pull_request:
    branches: ["main"]
    paths:
      - "admin/**"
      - "_layouts/**"
      - "_config.yml"
      - "Gemfile"
      - ".github/workflows/validate-cms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check editor JavaScript syntax
        run: |
          node --check admin/editor-modes.js
          node --check admin/studio.js

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/nuggetofjoy-jekyll"
        env:
          JEKYLL_ENV: production
