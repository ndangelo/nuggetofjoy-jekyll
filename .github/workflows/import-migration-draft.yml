name: Import WordPress migration draft

on:
  workflow_dispatch:
  push:
    paths:
      - 'migration-input/**'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Import converted content
        run: python scripts/import_migration_draft.py
      - name: Commit imported content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts _pages reports
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Import converted WordPress content"
            git push
          fi
