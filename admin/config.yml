# Decap CMS configuration for the Nugget of Joy Jekyll archive.
# Authentication must be configured before editors can publish.
# Never place GitHub tokens, OAuth secrets, or passwords in this public file.

backend:
  name: turbo-github
  turbo_site_id: e12e3730-ea7e-48f9-8b69-185654aef7c7
  branch: main

# Uploads are committed to the repository and published with the site.
media_folder: "assets/images/uploads"
public_folder: "/nuggetofjoy-jekyll/assets/images/uploads"

site_url: "https://ndangelo.github.io/nuggetofjoy-jekyll"
display_url: "https://ndangelo.github.io/nuggetofjoy-jekyll"

# Drafts and review changes go through GitHub pull requests.
publish_mode: editorial_workflow

# Make the interface useful for a large archive.
show_preview_links: true
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    description: "Manage published articles, tutorials, design briefs, and course resources."
    folder: "_posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{date}}"
    search_fields:
      - title
      - description
      - categories
      - tags
    view_filters:
      - label: Has featured image
        field: image
        pattern: ".+"
      - label: Missing featured image
        field: image
        pattern: "^$"
      - label: Has SEO description
        field: seo.seo_description
        pattern: ".+"
      - label: Missing excerpt
        field: description
        pattern: "^$"
      - label: Missing image alt text
        field: image_alt
        pattern: "^$"
    sortable_fields:
      - title
      - date
    view_groups:
      - label: Year
        field: date
        pattern: "\\d{4}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Title, name: title, widget: string }
      - label: Publish Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
      - { label: Permalink / Public URL, name: permalink, widget: string, required: false, hint: "Preserve the existing URL for older posts. Changing this can break links." }
      - { label: Description / Excerpt, name: description, widget: text, required: false, hint: "Short summary used on archive cards and as the default search/social description." }
      - { label: Author, name: author, widget: string, required: false, default: "Nicholas D’Angelo" }
      - { label: Featured Image, name: image, widget: image, required: false, media_folder: "assets/images/uploads", public_folder: "/nuggetofjoy-jekyll/assets/images/uploads" }
      - { label: Image Alt Text, name: image_alt, widget: string, required: false, hint: "Describe the image for screen readers; do not repeat the post title." }
      - { label: Featured Image Caption, name: image_caption, widget: string, required: false }
      - label: Search & Social Sharing
        name: seo
        widget: object
        required: false
        collapsed: true
        summary: "Search and social sharing settings"
        fields:
          - { label: SEO Title, name: seo_title, widget: string, required: false, hint: "Optional browser/search title. Leave blank to use the post title." }
          - { label: SEO Description, name: seo_description, widget: text, required: false, hint: "Optional description for search engines and link previews." }
          - { label: Social Sharing Image, name: social_image, widget: image, required: false, media_folder: "assets/images/uploads", public_folder: "/nuggetofjoy-jekyll/assets/images/uploads" }
          - { label: Canonical URL, name: canonical_url, widget: string, required: false, hint: "Only set this when this content's preferred URL is different from this page's URL." }
      - label: Categories
        name: categories
        widget: list
        required: false
        field: { label: Category, name: category, widget: string }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - { label: WordPress ID (legacy), name: wordpress_id, widget: hidden, required: false }
      - label: Related Resources
        name: related_links
        widget: list
        required: false
        label_singular: Resource
        summary: "{{fields.label}}"
        fields:
          - { label: Link Text, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - label: Content Blocks
        name: content_blocks
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.heading}}"
        hint: "Optional structured sections that appear after the main article body. Reorder blocks to change their order."
        types:
          - label: Callout / Note
            name: callout
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Style
                name: tone
                widget: select
                options:
                  - { label: Tip, value: tip }
                  - { label: Note, value: note }
                  - { label: Important, value: important }
                default: note
              - { label: Text, name: text, widget: markdown, required: true }
          - label: Image Gallery
            name: gallery
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Images
                name: images
                widget: list
                label_singular: Gallery Image
                summary: "{{fields.alt}}"
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Alt Text, name: alt, widget: string }
                  - { label: Caption, name: caption, widget: string, required: false }
          - label: Code Example
            name: code_example
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Code
                name: code
                widget: code
                default_language: html
                allow_language_selection: true
                keys: { code: code, lang: language }
          - label: Quote
            name: quote
            widget: object
            fields:
              - { label: Quote, name: quote, widget: text }
              - { label: Attribution, name: attribution, widget: string, required: false }
      - label: Body
        name: body
        widget: noj_body
        hint: "Use Rich Text for visual editing. Use Raw mode for Markdown and embedded HTML/source. The preview pane shows the rendered HTML result. A separate third HTML-editing mode would require a custom editor widget; do not switch modes on older posts until the preview looks correct."

  - name: content_pages
    label: Pages
    label_singular: Page
    description: "Manage standalone site pages. The homepage is maintained separately because it contains Jekyll template logic."
    folder: "_pages"
    create: true
    extension: "md"
    format: "frontmatter"
    filter:
      field: layout
      value: page
    slug: "{{slug}}"
    summary: "{{title}}"
    search_fields:
      - title
      - description
    fields:
      - { label: Layout, name: layout, widget: hidden, default: page }
      - { label: Title, name: title, widget: string }
      - { label: URL Slug, name: permalink, widget: string, required: false, hint: "Use the existing public URL when editing an established page." }
      - { label: Description, name: description, widget: text, required: false }
      - label: Search & Social Sharing
        name: seo
        widget: object
        required: false
        collapsed: true
        summary: "Search and social sharing settings"
        fields:
          - { label: SEO Title, name: seo_title, widget: string, required: false }
          - { label: SEO Description, name: seo_description, widget: text, required: false }
          - { label: Social Sharing Image, name: social_image, widget: image, required: false, media_folder: "assets/images/uploads", public_folder: "/nuggetofjoy-jekyll/assets/images/uploads" }
          - { label: Canonical URL, name: canonical_url, widget: string, required: false }
      - { label: WordPress ID (legacy), name: wordpress_id, widget: hidden, required: false }
      - label: Body
        name: body
        widget: noj_body
