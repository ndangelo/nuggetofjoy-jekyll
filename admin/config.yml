# Sveltia CMS configuration for the Nugget of Joy Jekyll staging site.
# This CMS writes to the staging repository only: ndangelo/nuggetofjoy-jekyll.
# Sign in with a GitHub personal access token that has Contents: Read and write.
# Never put the token in this file.

backend:
  name: github
  repo: ndangelo/nuggetofjoy-jekyll
  branch: main
  auth_methods: [token]
  prompt_commit_messages: true

site_url: "https://ndangelo.github.io/nuggetofjoy-jekyll"
display_url: "https://ndangelo.github.io/nuggetofjoy-jekyll"

media_folder: "assets/images/uploads"
public_folder: "/nuggetofjoy-jekyll/assets/images/uploads"

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    description: "Edit articles, tutorials, design briefs, and course resources."
    folder: "_posts"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - label: Has featured image
        field: image
        pattern: ".+"
      - label: Missing featured image
        field: image
        pattern: "^$"
      - label: Missing excerpt
        field: description
        pattern: "^$"
    view_groups:
      - label: Year
        field: date
        pattern: "\\d{4}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Title, name: title, widget: string, required: true }
      - label: Publish Date
        name: date
        widget: datetime
        type: datetime
        format: "YYYY-MM-DD HH:mm:ss"
        default: "{{now}}"
      - { label: Permalink / Public URL, name: permalink, widget: string, required: false, hint: "Preserve existing permalinks to avoid breaking links." }
      - { label: Description / Excerpt, name: description, widget: text, required: false }
      - { label: Custom CSS, name: custom_css, widget: code, default_language: css, output_code_only: true, allow_language_selection: false, required: false, hint: "CSS applied to this post by the site's layout, if configured. Do not include style tags." }
      - { label: Author, name: author, widget: string, required: false, default: "Nicholas D’Angelo" }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Image Alt Text, name: image_alt, widget: string, required: false }
      - { label: Featured Image Caption, name: image_caption, widget: string, required: false }
      - label: Categories
        name: categories
        widget: list
        required: false
        field: { label: Category, name: category, widget: string }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - label: Search & Social Sharing
        name: seo
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: SEO Title, name: seo_title, widget: string, required: false }
          - { label: SEO Description, name: seo_description, widget: text, required: false }
          - { label: Social Sharing Image, name: social_image, widget: image, required: false }
          - { label: Canonical URL, name: canonical_url, widget: string, required: false }
      - { label: Legacy WordPress ID, name: wordpress_id, widget: hidden, required: false }
      - label: Related Resources
        name: related_links
        widget: list
        required: false
        label_singular: Resource
        summary: "{{fields.label}}"
        fields:
          - { label: Link Text, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - label: Article Content
        name: body
        widget: richtext
        format: html
        hint: "Use the Visual mode for ordinary text and the Raw mode for legacy HTML, WordPress block markup, embeds, and CodePen projects. Inspect the raw source before changing complex posts."

  - name: content_pages
    label: Pages
    label_singular: Page
    folder: "_pages"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [title, date]
    fields:
      - { label: Layout, name: layout, widget: hidden, default: page }
      - { label: Title, name: title, widget: string, required: true }
      - { label: Publish / Update Date, name: date, widget: datetime, type: datetime, format: "YYYY-MM-DD HH:mm:ss", required: false }
      - { label: Permalink / Public URL, name: permalink, widget: string, required: false, hint: "Preserve existing permalinks to avoid breaking links." }
      - { label: Categories, name: categories, widget: list, required: false, field: { label: Category, name: category, widget: string } }
      - { label: Tags, name: tags, widget: list, required: false, field: { label: Tag, name: tag, widget: string } }
      - { label: Legacy WordPress ID, name: wordpress_id, widget: hidden, required: false }
      - label: Page Content
        name: body
        widget: richtext
        format: html
        hint: "Use Raw mode for legacy WordPress markup or embeds."

  - name: homepage_settings
    label: Homepage & Navigation
    files:
      - name: homepage
        label: Homepage Content & Navigation
        file: "_data/homepage.yml"
        format: yaml
        fields:
          - { label: Hero Eyebrow, name: hero_kicker, widget: string }
          - { label: Main Heading — First Line, name: hero_heading_start, widget: string }
          - { label: Main Heading — Emphasized Line, name: hero_heading_emphasis, widget: string }
          - { label: Introductory Text, name: hero_intro, widget: text }
          - { label: Search Placeholder, name: search_placeholder, widget: string }
          - { label: Header Search Placeholder, name: search_placeholder_header, widget: string, required: false }
          - { label: Browse Link Text, name: browse_link_text, widget: string }
          - label: Homepage Quick Links
            name: homepage_links
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Link Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - { label: Recent Posts Eyebrow, name: recent_kicker, widget: string }
          - { label: Recent Posts Heading, name: recent_heading, widget: string }
          - { label: Recent Posts Description, name: recent_description, widget: text }
          - { label: Number of Recent Posts, name: recent_posts_limit, widget: number, value_type: int, min: 1, max: 30 }
          - { label: Archive Eyebrow, name: archive_kicker, widget: string }
          - { label: Archive Heading, name: archive_heading, widget: string }
          - { label: Archive Description, name: archive_description, widget: text }
          - { label: Return Link Text, name: return_link_text, widget: string }
          - { label: Year List Eyebrow, name: year_list_kicker, widget: string }
          - label: Main Navigation
            name: navigation
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Navigation Label, name: label, widget: string }
              - { label: Destination URL, name: url, widget: string }

  - name: site_code
    label: Design & CSS
    description: "Edit the actual stylesheet files. Changes are committed to the staging repository and published by the Jekyll build."
    editor:
      preview: false
    files:
      - name: global_css
        label: Global CSS — Site-wide styles
        file: "assets/css/style.css"
        format: raw
        fields:
          - name: body
            label: CSS Source
            widget: code
            output_code_only: true
            allow_language_selection: false
            default_language: css
      - name: theme_css
        label: Theme CSS — Design system
        file: "assets/css/nuggetofjoy-theme.css"
        format: raw
        fields:
          - name: body
            label: CSS Source
            widget: code
            output_code_only: true
            allow_language_selection: false
            default_language: css
