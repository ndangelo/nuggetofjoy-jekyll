<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/nuggetofjoy-theme.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark-dimmed.min.css">
</head>
<body>
  <a class="noj-skip" href="#main">Skip to content</a>
  <header class="noj-header">
    <div class="noj-wrap noj-header-inner">
      <div class="noj-header-top">
        <a class="noj-brand" href="{{ '/' | relative_url }}"><span class="noj-brand-orange">nugget</span><span class="noj-brand-blue"> of joy</span></a>
        <form class="noj-search" role="search" action="{{ '/' | relative_url }}" method="get">
        <label class="screen-reader-text" for="noja-search-header">Search all content</label>
        <input id="noja-search-header" type="search" name="s" placeholder="Search the archive…">
        <button type="submit">Search</button>
        </form>
      </div>
      <nav class="noj-nav" aria-label="Main navigation">
        <ul class="noj-menu">
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/category/ui-ux/' | relative_url }}">UI/UX</a></li>
          <li><a href="{{ '/category/ia/' | relative_url }}">IA</a></li>
          <li><a href="{{ '/category/dmet-155-introduction-to-web-design/' | relative_url }}">Web Design</a></li>
          <li><a href="{{ '/category/interactive-social-media/' | relative_url }}">Interactive &amp; Social</a></li>
          <li><a href="{{ '/category/dmet-375-imaging-technology/' | relative_url }}">Imaging</a></li>
          <li><a href="{{ '/category/social-design/' | relative_url }}">Social Design</a></li>
          <li><a href="{{ '/about/' | relative_url }}">About</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="noj-footer">
    <div class="noj-wrap noj-footer-inner">
      <a class="noj-brand" href="{{ '/' | relative_url }}"><span class="noj-brand-orange">nugget</span><span class="noj-brand-blue"> of joy</span></a>
      <p>Communication, Art, Design &amp; Instruction</p>
      <p>© {{ site.time | date: "%Y" }} Communication, Art, Design &amp; Instruction</p>
    </div>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.hljs) {
        document.querySelectorAll(".noj-entry-content pre code").forEach(function (block) {
          window.hljs.highlightElement(block);
        });
      }
    });
  </script>
</body>
</html>
